name: Souvenir migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/**"
      - ".github/workflows/souvenir-migration-validation.yml"
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - ".github/workflows/souvenir-migration-validation.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kpx_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kpx_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kpx_migration_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kpx_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply every migration to a clean PostgreSQL database
        run: npx prisma migrate deploy
      - name: Confirm migration state
        run: npx prisma migrate status
